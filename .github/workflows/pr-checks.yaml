name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# These would more naturally be separate jobs, but GitHub actions “bills” each
# job separately and rounds up to the next minute, so four 10 second jobs “cost”
# my account 4 action minutes.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # SARIF reporting for zizmor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: true

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-msrv

      - run: deno install --frozen

      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        if: ${{ !cancelled() }}

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        if: ${{ !cancelled() }}
        with:
          persona: pedantic

      - name: deno check
        if: ${{ !cancelled() }}
        run: deno check

      - name: deno fmt
        if: ${{ !cancelled() }}
        run: deno fmt --check

      - name: deno lint
        if: ${{ !cancelled() }}
        run: deno lint

      - name: deno test
        if: ${{ !cancelled() }}
        run: deno test

      - name: vitest
        if: ${{ !cancelled() }}
        run: deno run vitest:run

      - uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
        if: ${{ !cancelled() }}

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ !cancelled() }}
        with:
          rust-version: "1.85.0"
          manifest-path: backend/Cargo.toml

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo +stable clippy --all-features --all-targets

      - name: cargo doc lints
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: --document-private-items -Dwarnings
        run: cargo +stable doc --no-deps --all-features

      - name: cargo msrv
        if: ${{ !cancelled() }}
        working-directory: backend
        run: cargo msrv verify

      - name: cargo build
        id: cargo_build
        if: ${{ !cancelled() }}
        run: cargo +stable build --tests --all-features

      - name: cargo test
        if: ${{ !cancelled() && steps.cargo_build.outcome == 'success' }}
        run: cargo +stable test --all-features
