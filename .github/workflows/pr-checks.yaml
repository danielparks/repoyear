name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# These would more naturally be separate jobs, but GitHub actions “bills” each
# job separately and rounds up to the next minute, so four 10 second jobs “cost”
# my account 4 action minutes.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # SARIF reporting for zizmor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: true

      - run: deno install --frozen

      - name: backend deno install
        working-directory: backend
        run: deno install --frozen

      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        if: ${{ !cancelled() }}

      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        if: ${{ !cancelled() }}
        with:
          persona: pedantic

      - name: deno check
        if: ${{ !cancelled() }}
        run: deno check

      - name: deno fmt
        if: ${{ !cancelled() }}
        run: deno fmt --check

      - name: deno lint
        if: ${{ !cancelled() }}
        run: deno lint

      - name: deno test
        if: ${{ !cancelled() }}
        run: deno test

      - name: vitest
        if: ${{ !cancelled() }}
        run: deno run vitest:run

      - name: backend deno check
        if: ${{ !cancelled() }}
        working-directory: backend
        run: deno check

      - name: backend deno fmt
        if: ${{ !cancelled() }}
        working-directory: backend
        run: deno fmt --check

      - name: backend deno lint
        if: ${{ !cancelled() }}
        working-directory: backend
        run: deno lint

      - name: backend deno test
        if: ${{ !cancelled() }}
        working-directory: backend
        run: deno task test

      - name: backend openapi parity
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          deno run -A src/main.ts openapi -o /tmp/repoyear-openapi-check.json
          diff -u ../src/api/openapi.json /tmp/repoyear-openapi-check.json
